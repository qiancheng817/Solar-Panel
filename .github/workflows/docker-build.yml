name: Build SolarPanel Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签'
        required: false
        default: 'v2.1.16'
      platforms:
        description: '构建平台（默认 amd64，飞牛/x86 用这个即可）'
        required: false
        default: 'linux/amd64'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=v2.1.16" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve platforms
        id: plat
        run: |
          echo "value=${{ github.event.inputs.platforms || 'linux/amd64' }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: contains(steps.plat.outputs.value, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./SolarPanel-Docker
          file: ./SolarPanel-Docker/Dockerfile
          platforms: ${{ steps.plat.outputs.value }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/solar-panel:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/solar-panel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 冒烟测试：真正把容器跑起来请求一次接口。
      # 编译通过 ≠ 运行正常（曾因函数自我递归导致栈溢出、请求 panic 返回 502）。
      - name: Smoke test
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/solar-panel:${{ steps.tag.outputs.value }}"
          docker run -d --name sp-smoke -p 18080:18080 "$IMG"
          code=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/resp.json -w '%{http_code}' http://localhost:18080/api/public.php || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          echo "public.php -> HTTP $code"
          head -c 200 /tmp/resp.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::public.php 未返回 200，容器日志："
            docker logs sp-smoke
            docker rm -f sp-smoke || true
            exit 1
          fi
          if docker logs sp-smoke 2>&1 | grep -q "panic:"; then
            echo "::error::容器日志中发现 panic"
            docker logs sp-smoke | grep -A 20 "panic:"
            docker rm -f sp-smoke || true
            exit 1
          fi
          echo "冒烟测试通过"
          docker logs sp-smoke | tail -15
          docker rm -f sp-smoke
