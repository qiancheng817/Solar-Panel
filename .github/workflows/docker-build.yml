name: Build SolarPanel Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签'
        required: false
        default: '2.1.16'
      platforms:
        description: '构建平台（默认 amd64，飞牛/x86 用这个即可）'
        required: false
        default: 'linux/amd64'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=2.1.16" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve platforms
        id: plat
        run: |
          echo "value=${{ github.event.inputs.platforms || 'linux/amd64' }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: contains(steps.plat.outputs.value, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./SolarPanel-Docker
          file: ./SolarPanel-Docker/Dockerfile
          platforms: ${{ steps.plat.outputs.value }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/solar-panel:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/solar-panel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
